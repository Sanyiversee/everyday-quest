<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>母狗游戏</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0e0b0d; color: #f3e9ec; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app { max-width: 640px; margin: 0 auto; padding: 20px 16px 80px; }
  .hidden { display: none !important; }
  h1 { font-size: 30px; text-align: center; margin: 8px 0 4px; letter-spacing: 4px; }
  h2 { font-size: 20px; margin: 6px 0; }
  h3 { font-size: 16px; margin: 4px 0; color: #ff8fa3; }
  .sub { text-align: center; color: #b08a94; font-size: 14px; margin: 0 0 16px; }
  .accent { color: #ff4d6d; }
  .card { background: #1c1518; border: 1px solid #3a2530; border-radius: 12px; padding: 16px; margin: 12px 0; }
  .story p { line-height: 1.9; margin: 10px 0; font-size: 16px; }
  .outcome { background: #241a20; border-left: 3px solid #ff4d6d; padding: 12px 14px; border-radius: 8px; margin: 14px 0; }
  .outcome p { line-height: 1.9; margin: 8px 0; font-size: 16px; }
  .task { background: #1a1e24; border: 1px dashed #4a5a7a; border-radius: 12px; padding: 16px; margin: 14px 0; }
  .task.done { border-style: solid; border-color: #2e7d5b; }
  button { display: block; width: 100%; border: none; border-radius: 999px; padding: 13px 20px; font-size: 16px; margin: 10px 0; cursor: pointer; font-family: inherit; }
  .btn-primary { background: #c2185b; color: #fff; }
  .btn-primary:disabled { background: #5c2b3c; color: #b08a94; cursor: default; }
  .btn-ghost { background: transparent; border: 1px solid #7a4a5a; color: #f3e9ec; }
  .btn-danger { background: transparent; border: 1px solid #a33; color: #ff9a9a; }
  .btn-small { width: auto; display: inline-block; padding: 8px 18px; font-size: 14px; margin: 4px 6px 4px 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .id-card { background: #1c1518; border: 1px solid #3a2530; border-radius: 12px; padding: 14px; cursor: pointer; }
  .id-card:hover { border-color: #c2185b; }
  .id-card .nm { font-size: 18px; font-weight: bold; }
  .id-card .tg { font-size: 13px; color: #b08a94; margin-top: 6px; line-height: 1.6; }
  .id-card .pg { font-size: 12px; color: #ff8fa3; margin-top: 8px; }
  .ch-row { background: #1c1518; border: 1px solid #3a2530; border-radius: 12px; padding: 14px 16px; margin: 10px 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .ch-row.locked { opacity: .45; cursor: default; }
  .ch-row .t { font-size: 16px; font-weight: bold; }
  .ch-row .s { font-size: 12px; color: #b08a94; margin-top: 4px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .topbar .link { background: none; border: none; color: #b08a94; font-size: 14px; width: auto; padding: 6px 0; margin: 0; cursor: pointer; }
  .center { text-align: center; }
  .big-title { font-size: 26px; color: #ff4d6d; text-align: center; margin: 20px 0 8px; }
  .warn { background: #241a20; border: 1px solid #5c2b3c; border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 1.8; color: #d8b6bf; margin: 16px 0; }
  .title-chip { display: inline-block; background: #2a1218; border: 1px solid #c2185b; color: #ff8fa3; border-radius: 999px; padding: 6px 14px; margin: 6px 6px 0 0; font-size: 14px; }
  footer { text-align: center; color: #6b4a54; font-size: 12px; margin-top: 32px; line-height: 1.8; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar" style="display:none">
    <button class="link" id="btn-home">‹ 选身份</button>
    <button class="link" id="btn-titles">我的称号</button>
  </div>

  <!-- 年龄门 -->
  <section id="screen-gate">
    <h1>母狗游戏</h1>
    <p class="sub">选一个身份，活成那个身份的母狗</p>
    <div class="warn">
      本游戏为虚构的成年人角色扮演。进入即表示你已满 18 周岁，自愿参与，随时可以退出。游戏进度只留在你的浏览器里；任务打卡时上传的图片/视频会发到管理员的 Telegram。
    </div>
    <button class="btn-primary" id="btn-enter">我已满 18 周岁，进入游戏</button>
    <button class="btn-ghost" id="btn-leave">未满 18 岁，离开</button>
  </section>

  <!-- 邀请码 -->
  <section id="screen-code" class="hidden">
    <h1>母狗游戏</h1>
    <p class="sub">凭邀请码进入</p>
    <div class="warn">
      没有邀请码进不去。邀请码和母狗学院是同一个，找管理员要。
    </div>
    <input id="code-input" type="password" maxlength="64" placeholder="输入邀请码" autocomplete="off" style="width:100%;box-sizing:border-box;margin:12px 0;padding:12px;border-radius:8px;border:1px solid #444;background:#121016;color:#fff">
    <p id="code-error" style="color:#ff7b7b;font-size:14px;min-height:20px;margin:4px 0 0"></p>
    <button class="btn-primary" id="btn-code-enter">进入游戏</button>
  </section>

  <!-- 选身份 -->
  <section id="screen-select" class="hidden">
    <h1>母狗游戏</h1>
    <p class="sub">选一个身份，开始你的剧情</p>
    <div class="grid" id="id-grid"></div>
    <footer>进度只存在你的浏览器里，换设备会丢失。<br><span id="foot-progress"></span></footer>
  </section>

  <!-- 章节列表 -->
  <section id="screen-chapters" class="hidden">
    <h2 id="ch-id-name"></h2>
    <p class="sub" id="ch-id-tagline" style="text-align:left"></p>
    <div id="ch-list"></div>
    <button class="btn-ghost" id="btn-back-select">返回选身份</button>
  </section>

  <!-- 游玩 -->
  <section id="screen-play" class="hidden">
    <h2 id="play-ch-title"></h2>
    <p class="sub" id="play-ch-sub" style="text-align:left"></p>
    <div class="card story" id="play-story"></div>
    <div id="play-choices"></div>
    <div id="play-outcome" class="hidden">
      <div class="outcome" id="play-outcome-text"></div>
      <div class="task" id="play-task">
        <h3 id="play-task-title"></h3>
        <p id="play-task-desc" style="line-height:1.8"></p>
        <div id="play-proof-old" class="hidden"></div>
        <p style="margin:10px 0 6px;color:#b08a94;font-size:14px">上传图片 / 视频（可选，证明会发到管理员的 Telegram）</p>
        <input type="file" id="proof-file" accept="image/*,video/*" style="width:100%">
        <div id="proof-preview" style="margin-top:10px"></div>
        <p id="proof-name" style="color:#b08a94;font-size:14px"></p>
        <input id="proof-player" maxlength="32" placeholder="你的代号（可选，方便认出是你）" style="width:100%;box-sizing:border-box;margin-top:6px;padding:10px;border-radius:8px;border:1px solid #444;background:#121016;color:#fff">
        <p id="proof-status" style="color:#b08a94;font-size:14px"></p>
        <button class="btn-primary" id="btn-task-done">任务打卡</button>
        <button class="btn-danger" id="btn-task-fail">没完成，任务失败</button>
      </div>
      <div id="play-next" class="hidden">
        <button class="btn-primary" id="btn-next"></button>
      </div>
    </div>
  </section>

  <!-- 通关 -->
  <section id="screen-complete" class="hidden">
    <div class="center">
      <p style="font-size:15px;color:#b08a94">恭喜，你通关了这个身份</p>
      <div class="big-title" id="complete-title"></div>
      <p id="complete-id-name" style="color:#b08a94"></p>
      <button class="btn-primary" id="btn-continue">换个身份继续</button>
      <button class="btn-ghost" id="btn-back-select2">返回选身份</button>
    </div>
  </section>

  <!-- 失败结局 -->
  <section id="screen-fail" class="hidden">
    <div class="center">
      <p style="font-size:15px;color:#b08a94">任务失败，这个身份的结局</p>
      <div class="big-title" id="fail-title"></div>
      <div class="card story" id="fail-ending" style="text-align:left"></div>
      <button class="btn-primary" id="btn-fail-restart">重新开始这个身份</button>
      <button class="btn-ghost" id="btn-fail-continue">换个身份继续</button>
    </div>
  </section>

  <!-- 称号 -->
  <section id="screen-titles" class="hidden">
    <h2>我的称号</h2>
    <div id="titles-list"></div>
    <button class="btn-ghost" id="btn-back-titles">返回</button>
    <button class="btn-danger" id="btn-reset">清除全部进度</button>
  </section>
</div>
<script>
window.__GAME_PARTS = window.__GAME_PARTS || {};
window.__GAME_PARTS.part1 = [
  {
    id: 'student',
    name: '学生',
    tagline: '白天是拿奖学金的乖学生，晚上跪着等主人检查作业。',
    title: '优等母狗',
    failTitle: '被开除的母狗',
    failEnding: [
      '任务失败的那天，你被叫到了空无一人的教室，讲台上还留着上一节课的粉笔灰。',
      '他站在讲台边上，连看都没看你一眼，只说了一句：你连当母狗的资格都没有了。',
      '你跪下去求他再给一次机会，膝盖磕在冰凉的水泥地上，疼得发抖。',
      '他说，机会给过你了，是你自己一次一次把它浪费掉的。',
      '学籍、奖学金、项圈，一样一样被收走，你站在原地，连哭都不敢出声。',
      '走出教室的时候，走廊里全是人，没人知道你刚才失去了什么。',
      '从今天起，你不再是他的优等母狗，只是一个被开除的母狗，连名字都不配再提。'
    ],
    chapters: [
      {
        title: '开学第一课',
        story: [
          '开学第一天早上，你穿着干净的白衬衫和格子裙走进教室，裙摆刚到膝盖，袜子雪白。',
          '你选了第三排靠窗的位置坐下，把书包放在桌肚里，坐得笔直，连后背都不敢靠椅背。',
          '没人知道，你的书包夹层里藏着一张主人手写的规矩，字迹很硬，像他说话的语气。',
          '你趁老师没来，偷偷摸了摸那张纸，纸角被你捏得发软。',
          '第一条：每天放学先跪着把作业写完，再吃饭。',
          '第二条：字写丑一个，晚上就多抄十遍。',
          '第三条：不许撒谎，撒谎一次，打手心十下。',
          '你把纸条塞回去，心跳得很快，耳根都热了。',
          '同桌转过来问你怎么脸这么红，你低下头说没事，就是有点热。',
          '老师走进来点名，点到你的时候你站起来，声音有点抖。',
          '粉笔在黑板上写字的声音一下一下的，你盯着黑板，脑子里却全是那三条规矩。',
          '下课铃一响，你第一个收拾书包，手心全是汗。',
          '回家的路上你走得很快，鞋底敲在地上的声音一声比一声急。',
          '你想着今晚跪在书桌前的样子，腿有点软，又有点期待。',
          '原来当一只好学生，比当一只好母狗难多了。',
          '可你也知道，两样都做不好的人，什么都当不成。'
        ],
        choices: [
          {
            text: '放学就跪着写作业，写完再吃饭',
            kind: 'obey',
            outcome: '你一回家就把鞋脱了，书包往边上一放，直接跪在书桌前，腰挺得笔直。\n作业一笔一画写得工工整整，连主人挑不出错。\n他走过来摸了摸你的头，说这才像个乖学生。\n你跪在那里没敢动，耳朵听着他的夸奖，心里又烫又满。',
            task: { title: '跪姿作业留影', desc: '今晚在宿舍书桌前跪着写完今天的作业，字迹工整，拍下跪姿和写满字的作业本，只留给自己看，拍完打卡。' }
          },
          {
            text: '作业明天再写，先玩手机',
            kind: 'resist',
            outcome: '手机刚打开就被没收了，屏幕还亮着你的名字。\n你被按在书桌前，手心挨了十下，疼得直掉眼泪。\n哭完了还是得跪着把作业补完，一笔都不许少。\n写到最后手都在抖，你才明白，拖延的那点快活，根本不够抵这顿罚。',
            task: { title: '罚抄规矩十遍', desc: '惩罚：把三条规矩各抄十遍，跪着抄，字写丑了重抄，抄完打卡。' }
          }
        ]
      },
      {
        title: '期中考试',
        story: [
          '期中考试前一周，你的宿舍台灯每晚亮到两点。',
          '书桌上堆着五六本教材，草稿纸写满了公式和错题，笔都快没水了。',
          '主人发来消息：考不好没有饭吃，只有罚。',
          '考得好呢？你问了一句，他只回了个笑脸，什么都没说。',
          '你盯着那个笑脸看了很久，越看越紧张，越紧张越想考好。',
          '从那天起你每天多背两小时，嘴里念念有词，连去食堂的路上都在背。',
          '室友以为你疯了，你笑笑没解释，低头继续背。',
          '梦里你都在默写，醒来发现被子被自己踢到了地上。',
          '考试那天早上，你站在考场门口，手心全是汗，准考证捏得皱了。',
          '卷子发下来，油墨味很重，你深吸一口气，逼自己一个字一个字看题。',
          '监考老师的脚步声在过道里一下一下走过去，你的手一直在抖，笔都快握不住了。',
          '做到最后一题的时候，你的后背已经全湿了，衬衫贴在背上。',
          '交卷的时候，你才发现自己全身都是汗，腿站起来都发软。',
          '走出考场你腿一软，扶着墙站了一会儿，才敢去看主人的消息。',
          '他只问了一句：尽力了吗。',
          '你回了两个字，尽力了，然后站在原地等，等他说下一句。'
        ],
        choices: [
          {
            text: '考前每天多背两小时，错一题罚抄十遍',
            kind: 'obey',
            outcome: '那一周你每天背到半夜，错一题就自己罚抄十遍。\n成绩出来那天，你排进了年级前十，名字贴在公告栏上。\n主人发来消息说，母狗也是可以拿奖学金的。\n你盯着那句话看了很久，鼻子有点酸，又有点骄傲。',
            task: { title: '背书录音', desc: '今晚在图书馆或宿舍角落录一段背书录音，错一处就重录，录完打卡。' }
          },
          {
            text: '考不好就考不好，反正他不会真罚',
            kind: 'resist',
            outcome: '成绩一出来，你就被拎到了书桌前。\n试卷上的红叉一个一个被圈出来，每个红叉十下手心。\n罚完了他才说，下次再敢这么想，罚抄整本课本。\n你跪在那里揉着发烫的手心，再也不敢说“考不好就考不好”这种话。',
            task: { title: '错题罚抄二十遍', desc: '惩罚：把这次考试错的题各抄二十遍，跪着抄，抄完打卡。' }
          }
        ]
      },
      {
        title: '毕业典礼',
        story: [
          '四年过去，你穿着学士服站在礼堂台上，优秀毕业生。',
          '学士帽的流苏垂在眼前，晃一下，你的心就跳一下。',
          '台下的人都在鼓掌，没人知道你裙子下面藏着什么。',
          '只有你自己知道，这身衣服是主人给你准备的，连里面的那件也是他挑的。',
          '校长走过来给你拨穗，手指碰到流苏的时候，你下意识地站得更直了。',
          '闪光灯一下一下亮着，你对着镜头笑，心里却只想着一个人。',
          '他说，毕业不是结束，是你正式成为他的母狗的开始。',
          '这句话你记了四年，今天终于到了。',
          '典礼结束，同学喊你去聚餐，你摇摇头说家里有事。',
          '手机震了一下，是他的消息，只有两个字：回来。',
          '你打车往家赶，学士服都没来得及换，帽子抱在怀里。',
          '一路上你都在想，今晚他会说什么，会不会给你戴上那个东西。',

        choices: [
          {
            text: '典礼一结束就回家跪着，等他授衔',

            outcome: '你跪在门口，学士服整整齐齐，帽子放在一边。\n他把项圈戴在你脖子上，金属凉凉的，贴着皮肤。\n他说从今天起你不再是学生了，你是他的优等母狗。\n毕业了，也归他了，你跪在那里，觉得这四年都值了。',
            task: { title: '十分钟回家令', desc: '毕业典礼散场后 10 分钟内赶回家跪好，文字汇报你到家的时间和跪了多久。' }
          },
          {
            text: '先去参加毕业聚餐，晚点再回去',
            kind: 'resist',
            outcome: '聚餐的酒还没喝完，电话就打过来了。\n你连招呼都没敢打就跑了出去，裙子都跑乱了，高跟鞋差点崴了脚。\n回家跪了一整晚，膝盖又酸又疼，一动都不敢动。\n他说母狗的毕业典礼，只需要他一个人到场。',
            task: { title: '毕业夜罚跪一小时', desc: '惩罚：聚餐回来后跪满一小时，一动不许动，文字汇报跪了多久、膝盖什么感觉。' }
          }
        ]
      },
      {
        title: '宿舍夜谈',

          '你看了眼上铺，室友的呼吸已经慢下来了，应该是快睡着了。',
          '你轻轻掀开被子，光脚踩在地板上，凉意一下子从脚底窜上来。',

          '他回了一个字：乖。',
          '你盯着那个字看了很久，膝盖跪得有点酸，可心里特别满。',

              "desc": "数一数今天采访你说错了几句话，一句一句数清楚，数完写下来再打卡。"
            }
          }
        ]
      },
      {
        "title": "影后加冕",
        "story": [
          "今晚，全场的灯都为你一个人亮。",
          "颁奖礼上，主持人念出了你的名字：今晚的影后。",
          "你站起来，穿着他挑的裙子，戴着他送的项圈，笑着走上台。",
          "全场都在鼓掌，闪光灯一下一下闪着你的眼睛。",
          "你拿着奖杯，手都在抖，可你第一时间想到的，是给他发消息。",
          "主人说，影后和平时不一样，平时是演戏，影后是他给你的。",
          "他让你把奖杯和项圈放在一起，摆给他看。",
          "你回到家，从包里拿出奖杯，又从首饰盒里拿出项圈。",
          "奖杯是金灿灿的，沉甸甸的，上面写着你的名字，是你演了三年的证明。",
          "项圈是皮的，上面有他的名字，是你归属的证明。",
          "你把两个东西并排摆在桌上，拍了张照片发过去，手都在抖。",
          "白天你是影后，拿奖、走红毯、接受采访，一个不少。",
          "只是你心里清楚，你演的每一个角色，都是替他演的。",
          "他回你：这才叫彻底。从今往后，你的奖杯归我，你的人也归我。",
          "你跪在地板上，看着奖杯和项圈，忽然觉得特别踏实。",
          "三年演下来的影后，抵不过他的一句话。"
        ],
        "choices": [
          {
            "text": "接受加冕，做影后母狗",
            "kind": "obey",
            "outcome": "你把奖杯和项圈并排摆好，拍照发过去，手都在抖，可心里却踏实得很。主人说：这才叫彻底。从今往后，你的奖杯归我，你的人也归我。你跪着回他：是，主人。回完这句话，你忽然觉得浑身都轻了，三年演下来的影后，抵不过他的一句话，可你一点都不后悔。",
            "task": {
              "title": "影后宣誓录音",
              "desc": "录一段影后宣誓，说你从今天起是影后母狗、是主人的专属，录三遍再打卡。"
            }
          },
          {
            "text": "当了影后就想自己说了算",
            "kind": "resist",
            "outcome": "你刚说想自己说了算，他就冷了：影后是谁给的，忘了？你的脸一下子白了，刚才那点底气全没了。今晚不许睡，把“影后是主人给的”手抄二十遍，抄完念三遍。你立刻改口，说自己错了，再也不敢提自己说了算，心里却又怕又庆幸，庆幸他还愿意管你。",
            "task": {
              "title": "加冕迟到认错书",
              "desc": "写一份认错书，写影后是谁给的、为什么你说了不算，写满一页再打卡。"
            }
          }
        ]
      }
    ]
  }
];

</script>
<script>
(function () {
  var IDENTITIES = []
    .concat(window.__GAME_PARTS.part1)
    .concat(window.__GAME_PARTS.part2)
    .concat(window.__GAME_PARTS.part3);

  var LS_KEY = 'mg-game-v1';
  var GATE_KEY = 'mg-gate-ok';
  var CODE_KEY = 'mg-code-ok';
  var state = load();
  var WORKER_URL = 'https://everyday-quest-realy.mugouxunlian.workers.dev';
  var playerName = '';
  try { playerName = localStorage.getItem('mg-player-name') || ''; } catch (e) {}

  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
      if (!s.done) s.done = {};
      if (!s.titles) s.titles = [];
      if (!s.failed) s.failed = {};
      if (!s.failTitles) s.failTitles = [];
      if (!s.checkins) s.checkins = {};
      return s;
    } catch (e) {
      return { done: {}, titles: [], failed: {}, failTitles: [], checkins: {} };
    }
  }
  function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
  function $(id) { return document.getElementById(id); }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  var screens = ['screen-gate', 'screen-code', 'screen-select', 'screen-chapters', 'screen-play', 'screen-complete', 'screen-fail', 'screen-titles'];
  function show(name) {
    screens.forEach(function (s) { $(s).classList.toggle('hidden', s !== name); });
    $('topbar').style.display = (name === 'screen-gate' || name === 'screen-code') ? 'none' : 'flex';
    window.scrollTo(0, 0);
  }

  var currentId = null, currentCh = 0, chosen = false, pendingProof = null, pendingFile = null;

  function isDone(id, ch) { return !!(state.done[id] && state.done[id][ch]); }
  function isUnlocked(id, ch) { return ch === 0 || isDone(id, ch - 1); }
  function progressOf(id) {
    var it = IDENTITIES.find(function (x) { return x.id === id; });
    var total = it ? it.chapters.length : 0;
    var d = state.done[id] || [], n = 0;
    for (var i = 0; i < total; i++) if (d[i]) n++;
    return n;
  }

  // ---- 选身份 ----
  function renderSelect() {
    var grid = $('id-grid');
    grid.innerHTML = '';
    var totalDone = 0, totalTitles = state.titles.length;
    IDENTITIES.forEach(function (it) {
      var n = progressOf(it.id);
      totalDone += n;
      var card = document.createElement('div');
      card.className = 'id-card';
      card.innerHTML = '<div class="nm">' + esc(it.name) + '</div>' +
        '<div class="tg">' + esc(it.tagline) + '</div>' +
        '<div class="pg">' + ((state.failed && state.failed[it.id]) ? '失败结局 · ' + esc(it.failTitle || '被抛弃的母狗') : (n === it.chapters.length ? '已通关 · ' + esc(it.title) : '已完成 ' + n + ' / ' + it.chapters.length + ' 章')) + '</div>';
      card.onclick = function () { renderChapters(it.id); };
      grid.appendChild(card);
    });
    var failCount = IDENTITIES.filter(function (it) { return state.failed && state.failed[it.id]; }).length;
    $('foot-progress').textContent = '已通关 ' + totalTitles + ' / 15 个身份 · 已完成 ' + totalDone + ' / 150 章' + (failCount ? ' · 失败结局 ' + failCount + ' 个' : '');
    show('screen-select');
  }

  // ---- 章节列表 ----
  function renderChapters(id) {
    currentId = id;
    var it = IDENTITIES.find(function (x) { return x.id === id; });
    $('ch-id-name').textContent = it.name;
    $('ch-id-tagline').textContent = it.tagline;
    var list = $('ch-list');
    list.innerHTML = '';
    var failed = !!(state.failed && state.failed[id]);
    if (failed) {
      var fb = document.createElement('div');
      fb.className = 'card';
      fb.innerHTML = '<p><b>这个身份已经失败结局：' + esc(it.failTitle || '被抛弃的母狗') + '</b></p><p class="small">任务失败，故事到这里就结束了。想重来就点下面重新开始。</p><button class="btn-primary" id="btn-ch-restart">重新开始这个身份</button>';
      list.appendChild(fb);
      var rb = document.getElementById('btn-ch-restart');
      if (rb) rb.onclick = function () { restartIdentity(id); };
    }
    it.chapters.forEach(function (ch, i) {
      var row = document.createElement('div');
      var unlocked = !failed && isUnlocked(id, i), done = isDone(id, i);
      var proof = state.checkins && state.checkins[id] && state.checkins[id][i];
      row.className = 'ch-row' + (unlocked ? '' : ' locked');
      row.innerHTML = '<div><div class="t">' + esc(ch.title) + '</div>' +
        '<div class="s">' + (done ? (proof ? '已打卡 ' + (proof.kind === 'video' ? '🎬' : '📷') : '已完成') : unlocked ? '可开始' : '完成上一章后解锁') + '</div></div>' +
        '<div>' + (done ? '✓' : unlocked ? '›' : '🔒') + '</div>';
      if (unlocked) row.onclick = function () { playChapter(id, i); };
      list.appendChild(row);
    });
    show('screen-chapters');
  }

  function restartIdentity(id) {
    if (state.done) delete state.done[id];
    if (state.failed) delete state.failed[id];
    if (state.checkins) delete state.checkins[id];
    save();
    renderChapters(id);
  }

  // ---- 游玩 ----
  function playChapter(id, chIdx) {
    currentId = id; currentCh = chIdx; chosen = false;
    var it = IDENTITIES.find(function (x) { return x.id === id; });
    var ch = it.chapters[chIdx];
    $('play-ch-title').textContent = ch.title;
    $('play-ch-sub').textContent = it.name + ' · 第 ' + (chIdx + 1) + ' 章 / 共 ' + it.chapters.length + ' 章';
    var storyLines = Array.isArray(ch.story) ? ch.story : [ch.story];
    $('play-story').innerHTML = storyLines.map(function (line) { return '<p>' + esc(line) + '</p>'; }).join('');
    var box = $('play-choices');
    box.innerHTML = '';
    ch.choices.forEach(function (choice) {
      var b = document.createElement('button');
      b.className = choice.kind === 'obey' ? 'btn-primary' : 'btn-danger';
      b.textContent = choice.text;
      b.onclick = function () { choose(choice); };
      box.appendChild(b);
    });
    $('play-outcome').classList.add('hidden');
    $('play-next').classList.add('hidden');
    $('play-task').classList.remove('done');
    $('btn-task-done').disabled = false;
    $('btn-task-done').textContent = '任务打卡';
    $('btn-task-fail').disabled = false;
    $('proof-file').value = '';
    $('proof-preview').innerHTML = '';
    $('proof-name').textContent = '';
    $('proof-player').value = playerName;
    $('proof-status').textContent = '';
    $('play-proof-old').classList.add('hidden');
    $('play-proof-old').innerHTML = '';
    pendingProof = null;
    pendingFile = null;
    show('screen-play');
  }

  function choose(choice) {
    if (chosen) return;
    chosen = true;
    var it = IDENTITIES.find(function (x) { return x.id === currentId; });
    var ch = it.chapters[currentCh];
    $('play-choices').innerHTML = '';
    var outLines = Array.isArray(choice.outcome) ? choice.outcome : [choice.outcome];
    $('play-outcome-text').innerHTML = outLines.map(function (line) { return '<p>' + esc(line) + '</p>'; }).join('');
    var task = choice.task || ch.task;
    $('play-task-title').textContent = '任务：' + task.title;
    $('play-task-desc').textContent = task.desc;
    var old = state.checkins && state.checkins[currentId] && state.checkins[currentId][currentCh];
    var ob = $('play-proof-old');
    if (old) {
      ob.innerHTML = '<p style="color:#b08a94;font-size:14px">上次打卡：' + esc(old.name || '') + '</p>' + (old.thumb ? '<img src="' + old.thumb + '" style="max-width:100%;border-radius:8px">' : '');
      ob.classList.remove('hidden');
    } else {
      ob.innerHTML = '';
      ob.classList.add('hidden');
    }
    $('play-outcome').classList.remove('hidden');
  }

  $('btn-task-done').onclick = function () {
    var it = IDENTITIES.find(function (x) { return x.id === currentId; });
    if (!state.done[currentId]) state.done[currentId] = [];
    state.done[currentId][currentCh] = true;
    if (pendingProof) {
      if (!state.checkins) state.checkins = {};
      if (!state.checkins[currentId]) state.checkins[currentId] = {};
      state.checkins[currentId][currentCh] = pendingProof;
      pendingProof = null;
    }
    var fileToSend = pendingFile;
    pendingFile = null;
    if (fileToSend) {
      var st = $('proof-status');
      st.textContent = '证明上传中…';
      var pn = $('proof-player').value.trim();
      if (pn !== playerName) {
        playerName = pn;
        try { localStorage.setItem('mg-player-name', pn); } catch (e) {}
      }
      var fd = new FormData();
      fd.append('file', fileToSend);
      fd.append('identity', it.name);
      fd.append('chapter', it.chapters[currentCh].title);
      fd.append('task', $('play-task-title').textContent.replace(/^任务：/, ''));
      if (pn) fd.append('player', pn);
      fetch(WORKER_URL + '/game-checkin', { method: 'POST', body: fd })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          st.textContent = j && j.ok ? '证明已发到 Telegram ✓' : '证明没发出去（' + ((j && j.error) || '网络问题') + '），可重进本章重新上传';
        })
        .catch(function () {
          st.textContent = '证明没发出去（网络问题），可重进本章重新上传';
        });
    }
    var last = currentCh === it.chapters.length - 1;
    if (last && state.titles.indexOf(it.title) === -1) state.titles.push(it.title);
    save();
    $('play-task').classList.add('done');
    var b = $('btn-task-done');
    b.disabled = true;
    b.textContent = '已打卡 ✓';
    var next = $('btn-next');
    if (last) {
      next.textContent = '结算通关';
      next.onclick = function () {
        $('complete-title').textContent = '「' + it.title + '」';
        $('complete-id-name').textContent = it.name + ' · 已通关';
        show('screen-complete');
      };
    } else {
      next.textContent = '下一章';
      next.onclick = function () { playChapter(currentId, currentCh + 1); };
    }
    $('play-next').classList.remove('hidden');
  };

  function makeThumb(dataUrl, cb) {
    try {
      var img = new Image();
      img.onload = function () {
        try {
          var max = 480, w = img.width, h = img.height;
          var scale = Math.min(1, max / Math.max(w, h));
          var cv = document.createElement('canvas');
          cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          cb(cv.toDataURL('image/jpeg', 0.7));
        } catch (e) { cb(dataUrl.length < 1024 * 1024 ? dataUrl : null); }
      };
      img.onerror = function () { cb(dataUrl.length < 1024 * 1024 ? dataUrl : null); };
      img.src = dataUrl;
    } catch (e) { cb(null); }
  }

  $('proof-file').addEventListener('change', function () {
    var f = this.files && this.files[0];
    pendingProof = null;
    pendingFile = f || null;
    var prev = $('proof-preview'), nm = $('proof-name');
    prev.innerHTML = ''; nm.textContent = '';
    if (!f) return;
    var kind = f.type && f.type.indexOf('video/') === 0 ? 'video' : 'image';
    nm.textContent = '已选：' + f.name + '（' + (f.size / 1024).toFixed(0) + ' KB）';
    pendingProof = { kind: kind, name: f.name, size: f.size, type: f.type, thumb: null };
    if (kind === 'video') {
      var u = window.URL || window.webkitURL;
      if (u && u.createObjectURL) prev.innerHTML = '<video src="' + u.createObjectURL(f) + '" controls style="max-width:100%;border-radius:8px"></video>';
    } else {
      var reader = new FileReader();
      reader.onload = function (e) {
        var dataUrl = e.target.result;
        prev.innerHTML = '<img src="' + dataUrl + '" style="max-width:100%;border-radius:8px">';
        makeThumb(dataUrl, function (thumb) { if (pendingProof) pendingProof.thumb = thumb; });
      };
      reader.readAsDataURL(f);
    }
  });

  $('btn-task-fail').onclick = function () {
    var it = IDENTITIES.find(function (x) { return x.id === currentId; });
    if (!state.failed) state.failed = {};
    if (!state.failTitles) state.failTitles = [];
    state.failed[currentId] = true;
    var ft = it.failTitle || '被抛弃的母狗';
    if (state.failTitles.indexOf(ft) === -1) state.failTitles.push(ft);
    save();
    showFail(it);
  };

  function showFail(it) {
    $('fail-title').textContent = '「' + (it.failTitle || '被抛弃的母狗') + '」';
    var lines = Array.isArray(it.failEnding) && it.failEnding.length ? it.failEnding : ['你没能完成任务。', '主人收回了给你的机会。', '这个身份的故事，到这里就结束了。'];
    $('fail-ending').innerHTML = lines.map(function (line) { return '<p>' + esc(line) + '</p>'; }).join('');
    show('screen-fail');
  }

  // ---- 称号 ----
  function renderTitles() {
    var list = $('titles-list');
    if (!state.titles.length) {
      list.innerHTML = '<div class="card">还没有称号，去通关一个身份吧。</div>';
    } else {
      list.innerHTML = '<div class="card">' + state.titles.map(function (t) { return '<span class="title-chip">' + esc(t) + '</span>'; }).join('') + '</div>';
    }
    if (state.failTitles && state.failTitles.length) {
      list.innerHTML += '<div class="card"><h3>失败结局</h3>' + state.failTitles.map(function (t) { return '<span class="title-chip">' + esc(t) + '</span>'; }).join('') + '</div>';
    }
    show('screen-titles');
  }

  // ---- 顶栏 / 入口 ----
  $('btn-home').onclick = renderSelect;
  $('btn-titles').onclick = renderTitles;
  $('btn-back-select').onclick = renderSelect;
  $('btn-back-select2').onclick = renderSelect;
  $('btn-continue').onclick = renderSelect;
  $('btn-back-titles').onclick = renderSelect;
  $('btn-fail-restart').onclick = function () { restartIdentity(currentId); };
  $('btn-fail-continue').onclick = renderSelect;
  $('btn-reset').onclick = function () {
    if (confirm('确定要清除全部进度和称号吗？')) {
      state = { done: {}, titles: [], failed: {}, failTitles: [], checkins: {} };
      save();
      renderSelect();
    }
  };
  function codeVerified() {
    try { return localStorage.getItem(CODE_KEY) === '1'; } catch (e) { return false; }
  }
  function enterAfterGate() {
    if (codeVerified()) renderSelect();
    else show('screen-code');
  }
  $('btn-code-enter').onclick = function () {
    var code = $('code-input').value.trim();
    var err = $('code-error');
    if (!code) { err.textContent = '请先输入邀请码。'; return; }
    err.textContent = '验证中…';
    $('btn-code-enter').disabled = true;
    var fd = new FormData();
    fd.append('code', code);
    fetch(WORKER_URL + '/game-verify-code', { method: 'POST', body: fd })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        $('btn-code-enter').disabled = false;
        if (j && j.ok) {
          try { localStorage.setItem(CODE_KEY, '1'); } catch (e) {}
          err.textContent = '';
          renderSelect();
        } else {
          err.textContent = '邀请码不正确。';
        }
      })
      .catch(function () {
        $('btn-code-enter').disabled = false;
        err.textContent = '验证失败，请检查网络后重试。';
      });
  };
  $('code-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('btn-code-enter').click();
  });
  $('btn-enter').onclick = function () {
    try { localStorage.setItem(GATE_KEY, '1'); } catch (e) {}
    enterAfterGate();
  };
  $('btn-leave').onclick = function () {
    document.body.innerHTML = '<div style="max-width:640px;margin:0 auto;padding:60px 20px;text-align:center;color:#b08a94;line-height:2">未满 18 周岁不能进入。<br>等你成年了再来。</div>';
  };

  if (IDENTITIES.length !== 15 || IDENTITIES.some(function (it) { return !it.chapters || it.chapters.length !== 10; })) {
    document.body.innerHTML = '<div style="max-width:640px;margin:0 auto;padding:60px 20px;text-align:center;color:#b08a94;line-height:2">游戏内容加载失败，请重新打开。</div>';
    return;
  }
  try {
    if (localStorage.getItem(GATE_KEY) === '1') enterAfterGate();
  } catch (e) {}
})();
</script>
</body>
</html>
